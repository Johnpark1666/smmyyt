[package]
name = "app"
version = "0.1.0"
default-run = "app"  # bin이 2개(app/server)라 tauri:dev가 기본 바이너리 지정 필요
description = "SMMYNP — Pure Rust backend"
authors = ["you"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.2", features = [] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
quick-xml = "0.37"
regex = "1"
base64 = "0.22"
open = "5"
sha2 = "0.10"
notify-rust = "4"
tauri-plugin-dialog = "2"

# Windows 전용 (GUI 앱) — Linux 서버 빌드에서 windows-future 0.2.1 크로스 컴파일 버그 회피
[target.'cfg(target_os = "windows")'.dependencies]
winrt-notification = "0.5"
windows = { version = "0.61", features = ["Win32_UI_Shell", "Win32_Foundation", "Win32_System_Registry", "Win32_System_SystemServices", "Win32_Security"] }
